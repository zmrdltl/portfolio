<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="928" height="280" viewBox="0 0 928 280" role="img" aria-labelledby="title desc">
  <title id="title">TmaxCloud Pre-Deployment API Test Path</title>
  <desc id="desc">UI definitions produce Java, SQL, and DDL artifacts; a pre-deployment test UI calls them with real JSON over WebSocket and checks API responses and database writes and reads.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
      svg {
        --paper: #f5f5f5;
        --paper-2: #fafafa;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #667085;
        --rule: rgba(45, 49, 66, 0.12);
        --rule-solid: #bfc0c0;
        --accent: #4051b5;
        --accent-tint: rgba(64, 81, 181, 0.08);
        --link: #2e5aa8;
      }
      text { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
      .connector { fill: none; stroke: var(--muted); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; }
      .connector-accent { stroke: var(--accent); stroke-width: 1.6; }
      .connector-secondary { stroke-dasharray: 5 5; stroke-width: 1.1; }
      .node { fill: var(--paper-2); stroke: var(--rule-solid); stroke-width: 1; }
      .node-accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
      .node-terminal { fill: rgba(45, 49, 66, 0.05); }
      .node-title { fill: var(--ink); font-size: 13px; font-weight: 600; }
      .node-meta, .edge-label, .callout-kicker { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node-meta { fill: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.035em; }
      .edge-label { fill: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.025em; }
      .edge-label-accent { fill: var(--accent); }
      .label-mask { fill: var(--paper); }
      .lifeline { stroke: var(--rule-solid); stroke-dasharray: 4 6; stroke-width: 1; }
      .decision { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
      .start { fill: var(--ink); }
      .callout { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1; }
      .callout-kicker { fill: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
      .callout-text { fill: var(--ink); font-size: 11px; font-weight: 500; }
      .arrow { fill: var(--muted); }
      .arrow-accent { fill: var(--accent); }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" overflow="visible">
      <polygon class="arrow" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" overflow="visible">
      <polygon class="arrow-accent" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>
  <rect width="928" height="280" fill="var(--paper)"/>
  <g aria-hidden="true">
    <path class="connector" d="M 200 140 H 256" marker-end="url(#arrow)"/>
    <path class="connector connector-accent" d="M 432 140 H 488" marker-end="url(#arrow-accent)"/>
    <path class="connector" d="M 664 140 H 720" marker-end="url(#arrow)"/>
<rect class="label-mask" x="196" y="108" width="72" height="26" rx="4"/>
<text class="edge-label" x="232" y="125" text-anchor="middle">GENERATE</text>
<rect class="label-mask" x="440" y="108" width="48" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="464" y="125" text-anchor="middle">CALL</text>
<rect class="label-mask" x="664" y="108" width="64" height="26" rx="4"/>
<text class="edge-label" x="696" y="125" text-anchor="middle">VERIFY</text>
<rect class="node" x="32" y="92" width="168" height="96" rx="8"/>
<text class="node-title" x="116" y="122" text-anchor="middle">UI Definition</text>
<text class="node-meta" x="116" y="146" text-anchor="middle">APP · ENTITY · SERVICE</text>
<rect class="node" x="264" y="92" width="168" height="96" rx="8"/>
<text class="node-title" x="348" y="122" text-anchor="middle">Generated</text>
<text class="node-title" x="348" y="140" text-anchor="middle">Artifacts</text>
<text class="node-meta" x="348" y="164" text-anchor="middle">JAVA · SQL · DDL</text>
<rect class="node node-accent" x="496" y="92" width="168" height="96" rx="8"/>
<text class="node-title" x="580" y="122" text-anchor="middle">Pre-Deployment</text>
<text class="node-title" x="580" y="140" text-anchor="middle">Test UI</text>
<text class="node-meta" x="580" y="164" text-anchor="middle">JSON · WEBSOCKET</text>
<rect class="node" x="728" y="92" width="168" height="96" rx="8"/>
<text class="node-title" x="812" y="122" text-anchor="middle">Result Check</text>
<text class="node-meta" x="812" y="146" text-anchor="middle">API RESPONSE · DB I/O</text>

  </g>
</svg>
