    <line class="connector" x1="584" y1="516" x2="840" y2="516" marker-end="url(#arrow)"/>
<rect class="label-mask" x="304" y="138" width="96" height="26" rx="4"/>
<text class="edge-label" x="352" y="155" text-anchor="middle">Check capacity</text>
<rect class="label-mask" x="636" y="178" width="152" height="26" rx="4"/>
<text class="edge-label" x="712" y="195" text-anchor="middle">Read pre-reservation state</text>
<rect class="label-mask" x="644" y="218" width="136" height="26" rx="4"/>
<text class="edge-label" x="712" y="235" text-anchor="middle">Capacity available</text>
<rect class="label-mask" x="412" y="258" width="112" height="26" rx="4"/>
<text class="edge-label" x="468" y="275" text-anchor="middle">Check capacity</text>
<rect class="label-mask" x="644" y="298" width="136" height="26" rx="4"/>
<text class="edge-label" x="712" y="315" text-anchor="middle">Read the same state</text>
<rect class="label-mask" x="656" y="338" width="112" height="26" rx="4"/>
<text class="edge-label" x="712" y="355" text-anchor="middle">Capacity available</text>
<rect class="label-mask" x="296" y="378" width="112" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="352" y="395" text-anchor="middle">Reserve capacity</text>
<rect class="label-mask" x="652" y="418" width="120" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="712" y="435" text-anchor="middle">Record reservation</text>
<rect class="label-mask" x="412" y="458" width="112" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="468" y="475" text-anchor="middle">Reserve capacity</text>
<rect class="label-mask" x="652" y="498" width="120" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="712" y="515" text-anchor="middle">Record reservation</text>
<rect class="node" x="36" y="36" width="168" height="76" rx="8"/>
<text class="node-title" x="120" y="70" text-anchor="middle">LLM API</text>
<text class="node-title" x="120" y="88" text-anchor="middle">Call A</text>
<rect class="node" x="268" y="36" width="168" height="76" rx="8"/>
<text class="node-title" x="352" y="70" text-anchor="middle">LLM API</text>
<text class="node-title" x="352" y="88" text-anchor="middle">Call B</text>
<rect class="node" x="500" y="36" width="168" height="76" rx="8"/>
<text class="node-title" x="584" y="70" text-anchor="middle">LLM API</text>
<text class="node-title" x="584" y="88" text-anchor="middle">Rate Limiter</text>
<rect class="node" x="756" y="36" width="168" height="76" rx="8"/>
<text class="node-title" x="840" y="70" text-anchor="middle">Reservation /</text>
<text class="node-title" x="840" y="88" text-anchor="middle">Capacity State</text>
    <rect class="callout" x="520" y="548" width="392" height="56" rx="8"/>
    <text class="callout-kicker" x="540" y="570">RACE RISK</text>
    <text class="callout-text" x="540" y="590">Two calls pass from one snapshot, allowing over-reservation</text>
  </g>
</svg>
