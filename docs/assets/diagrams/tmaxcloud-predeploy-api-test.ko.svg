<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="928" height="608" viewBox="0 0 928 608" role="img" aria-labelledby="title desc">
  <title id="title">TmaxCloud 배포 전 API 테스트 화면 예시</title>
  <desc id="desc">기능을 설명하기 위한 예시 화면입니다. UI 정의에서 생성한 Java·SQL·DDL을 배포 전 테스트 화면에서 JSON과 WebSocket으로 호출하고 API 응답과 DB 쓰기·읽기를 확인합니다. label 값 sample은 예시 데이터이며 실제 제품 화면을 재현한 것이 아닙니다.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
      svg {
        --paper: #f5f5f5;
        --paper-2: #fafafa;
        --ink: #2d3142;
        --muted: #4f5d75;
        --rule: rgba(45, 49, 66, 0.12);
        --rule-solid: #bfc0c0;
        --accent: #4051b5;
        --accent-tint: rgba(64, 81, 181, 0.08);
        --link: #2e5aa8;
      }
      text { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; fill: var(--ink); }
      .heading { font-size: 32px; font-weight: 600; }
      .label { font-size: 20px; font-weight: 600; }
      .body { font-size: 16px; font-weight: 400; }
      .meta { font-size: 16px; font-weight: 500; fill: var(--muted); }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .code { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; }
      .value { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 32px; font-weight: 600; }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .on-accent { fill: var(--paper-2); }
      .surface { fill: var(--paper-2); stroke: var(--rule-solid); stroke-width: 1; }
      .rule { fill: none; stroke: var(--rule-solid); stroke-width: 1; }
      .connector { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .connector-accent { stroke: var(--accent); stroke-width: 1.6; }
      .guide { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 4; }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--accent)"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--link)"/>
    </marker>
  </defs>
  <rect width="928" height="608" fill="var(--paper)"/>
  <g aria-hidden="true">
    <text class="meta" x="32" y="36">API TEST / 기능 설명용 화면 예시</text>
    <text class="heading" x="32" y="84">배포 전에 API 호출·결과 확인</text>
    <text class="body muted" x="32" y="120">UI 정의 → Java · SQL · DDL 생성 → 테스트 화면</text>
    <rect x="32" y="152" width="864" height="392" rx="8" class="surface"/>
<path class="rule" d="M 32 216 H 896 M 448 216 V 544"/>
    <text class="label" x="56" y="192">선택한 생성 API</text>
    <text class="meta mono" x="576" y="192">WebSocket</text>
    <rect x="736" y="168" width="136" height="32" rx="4" fill="var(--accent)"/>
<path d="M 752 176 L 764 184 L 752 192 Z" fill="var(--paper-2)"/>
    <text class="label on-accent" x="800" y="192" text-anchor="middle">실행</text>
    <text class="label" x="56" y="256">JSON 요청</text>
    <text class="meta" x="424" y="256" text-anchor="end">편집</text>
    <rect x="48" y="272" width="384" height="248" rx="4" fill="var(--paper)"/>
<path class="rule" d="M 96 288 V 504"/>
    <text class="meta mono" x="80" y="312" text-anchor="end">1</text>
    <text class="code" x="112" y="312">{</text>
    <text class="meta mono" x="80" y="348" text-anchor="end">2</text>
    <text class="code" x="128" y="348">"label": "sample"</text>
    <text class="meta mono" x="80" y="384" text-anchor="end">3</text>
    <text class="code" x="112" y="384">}</text>
    <text class="body muted" x="112" y="480">JSON 값 입력 후 실행</text>
    <text class="label" x="472" y="256">API 응답</text>
    <text class="code" x="488" y="292">{</text>
    <text class="code" x="504" y="328">"label": "sample"</text>
    <text class="code" x="488" y="364">}</text>
<path class="rule" d="M 448 384 H 896"/>
    <text class="label" x="472" y="416">DB 결과</text>
    <text class="meta" x="872" y="416" text-anchor="end">쓰기·읽기 확인</text>
    <rect x="472" y="436" width="400" height="28" fill="var(--paper)"/>
    <text class="meta" x="488" y="456">필드</text>
    <text class="meta" x="656" y="456">저장·조회 값</text>
    <text class="code" x="488" y="500">label</text>
    <text class="code" x="656" y="500">sample</text>
    <text class="body muted" x="32" y="580">화면 구성과 JSON 값은 테스트 기능을 설명하기 위한 예시입니다.</text>
  </g>
</svg>
