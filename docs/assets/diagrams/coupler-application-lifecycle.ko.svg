<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384" role="img" aria-labelledby="title desc">
  <title id="title">Coupler 그룹미팅 참가 신청 생명주기</title>
  <desc id="desc">참가 신청을 승인하면 참가 승인 상태가 됩니다. 승인 뒤에는 운영자가 신청을 취소하거나 참가자가 나갈 수 있으며, 운영자가 취소한 신청은 다시 제출할 수 있습니다.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');

      svg {
        --paper: #f5f5f5;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #7a8399;
        --accent: #4051b5;
        --accent-tint: rgba(64, 81, 181, 0.08);
        --link: #2e5aa8;
      }

      text { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
      .connector { fill: none; stroke: var(--muted); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.2; }
      .connector-accent { stroke: var(--accent); }
      .connector-secondary { stroke-dasharray: 4 4; stroke-width: 0.8; }
      .state { fill: #fff; stroke: var(--ink); stroke-width: 1; }
      .state-accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      .state-terminal { fill: rgba(45, 49, 66, 0.05); stroke: var(--muted); }
      .state-name { fill: var(--ink); font-size: 12px; font-weight: 600; text-anchor: middle; }
      .state-code,
      .transition-label { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .state-code { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.08em; text-anchor: middle; }
      .transition-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.06em; text-anchor: middle; }
      .transition-label-accent { fill: var(--accent); }
      .label-mask { fill: var(--paper); }
      .start { fill: var(--ink); }
      .arrow-default { fill: var(--muted); }
      .arrow-accent { fill: var(--accent); }
      .arrow-link { fill: var(--link); }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="arrow-default" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="arrow-accent" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="arrow-link" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect width="800" height="384" fill="var(--paper)"/>

  <!-- Transitions first, then masks, then states. -->
  <line class="connector" x1="40" y1="112" x2="64" y2="112" marker-end="url(#arrow)"/>
  <line class="connector connector-accent" x1="224" y1="112" x2="320" y2="112" marker-end="url(#arrow-accent)"/>
  <line class="connector" x1="480" y1="112" x2="576" y2="112" marker-end="url(#arrow)"/>
  <line class="connector" x1="400" y1="160" x2="400" y2="240" marker-end="url(#arrow)"/>
  <path class="connector connector-secondary" d="M 656 64 V 44 Q 656 36 648 36 H 152 Q 144 36 144 44 V 64" marker-end="url(#arrow)"/>

  <rect class="label-mask" x="244" y="88" width="56" height="16" rx="4"/>
  <text class="transition-label transition-label-accent" x="272" y="100">승인</text>
  <rect class="label-mask" x="492" y="88" width="72" height="16" rx="4"/>
  <text class="transition-label" x="528" y="100">운영자 취소</text>
  <rect class="label-mask" x="408" y="184" width="64" height="16" rx="4"/>
  <text class="transition-label" x="440" y="196">나가기</text>
  <rect class="label-mask" x="368" y="12" width="64" height="16" rx="4"/>
  <text class="transition-label" x="400" y="24">재신청</text>

  <circle class="start" cx="32" cy="112" r="6"/>

  <rect class="state" x="64" y="64" width="160" height="96" rx="8"/>
  <text class="state-name" x="144" y="104">참가 신청</text>
  <text class="state-code" x="144" y="128">APPLIED</text>

  <rect class="state state-accent" x="320" y="64" width="160" height="96" rx="8"/>
  <text class="state-name" x="400" y="104">참가 승인</text>
  <text class="state-code" x="400" y="128">APPROVED</text>

  <rect class="state state-terminal" x="576" y="64" width="160" height="96" rx="8"/>
  <text class="state-name" x="656" y="104">신청 취소</text>
  <text class="state-code" x="656" y="128">CANCELED</text>

  <rect class="state state-terminal" x="320" y="240" width="160" height="96" rx="8"/>
  <text class="state-name" x="400" y="280">참가자 나감</text>
  <text class="state-code" x="400" y="304">LEFT</text>
</svg>
