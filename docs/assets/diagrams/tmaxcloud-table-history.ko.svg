<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">TmaxCloud 데이터 변경 이력 구조</title>
  <desc id="desc">하나의 엔티티 정의에서 원본·이력 테이블 DDL과 CRUD 저장 코드를 생성하고, 기본 키·수정자·유효 기간·행 데이터를 모아 지정 날짜의 상태와 마지막 변경자를 복원하는 구조입니다.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
      svg {
        --paper: #f5f5f5;
        --paper-2: #fafafa;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #667085;
        --rule: rgba(45, 49, 66, 0.12);
        --rule-solid: #bfc0c0;
        --accent: #4051b5;
        --accent-tint: rgba(64, 81, 181, 0.08);
        --link: #2e5aa8;
      }
      text { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
      .connector { fill: none; stroke: var(--muted); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; }
      .connector-accent { stroke: var(--accent); stroke-width: 1.6; }
      .connector-secondary { stroke-dasharray: 5 5; stroke-width: 1.1; }
      .node { fill: var(--paper-2); stroke: var(--rule-solid); stroke-width: 1; }
      .node-accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
      .node-terminal { fill: rgba(45, 49, 66, 0.05); }
      .node-title { fill: var(--ink); font-size: 13px; font-weight: 600; }
      .node-meta, .edge-label, .callout-kicker { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node-meta { fill: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.035em; }
      .edge-label { fill: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.025em; }
      .edge-label-accent { fill: var(--accent); }
      .label-mask { fill: var(--paper); }
      .lifeline { stroke: var(--rule-solid); stroke-dasharray: 4 6; stroke-width: 1; }
      .decision { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
      .start { fill: var(--ink); }
      .callout { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1; }
      .callout-kicker { fill: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
      .callout-text { fill: var(--ink); font-size: 11px; font-weight: 500; }
      .arrow { fill: var(--muted); }
      .arrow-accent { fill: var(--accent); }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="arrow" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="arrow-accent" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="var(--paper)"/>
  <g aria-hidden="true">
    <path class="connector" d="M 200 188 H 216 Q 224 188 224 180 V 108 Q 224 100 232 100 H 248" marker-end="url(#arrow)"/>
    <path class="connector" d="M 200 212 H 216 Q 224 212 224 220 V 292 Q 224 300 232 300 H 248" marker-end="url(#arrow)"/>
    <path class="connector" d="M 424 100 H 456 Q 464 100 464 108 V 180 Q 464 188 472 188 H 504" marker-end="url(#arrow)"/>
    <path class="connector" d="M 424 300 H 456 Q 464 300 464 292 V 220 Q 464 212 472 212 H 504" marker-end="url(#arrow)"/>
    <path class="connector connector-accent" d="M 696 200 H 752" marker-end="url(#arrow-accent)"/>
<rect class="label-mask" x="200" y="124" width="104" height="26" rx="4"/>
<text class="edge-label" x="252" y="141" text-anchor="middle">같은 스키마</text>
<rect class="label-mask" x="408" y="252" width="104" height="26" rx="4"/>
<text class="edge-label" x="460" y="269" text-anchor="middle">변경 전</text>
<rect class="label-mask" x="680" y="160" width="88" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="724" y="177" text-anchor="middle">시점 조회</text>
    <rect class="node" x="32" y="152" width="168" height="96" rx="8"/>
<text class="node-title" x="116" y="182" text-anchor="middle">엔티티 정의</text>
<text class="node-meta" x="116" y="206" text-anchor="middle">열 · 기본 키 · 이력 사용</text>
    <rect class="node" x="256" y="52" width="168" height="96" rx="8"/>
<text class="node-title" x="340" y="82" text-anchor="middle">DDL 생성</text>
<text class="node-meta" x="340" y="106" text-anchor="middle">원본 + 이력 테이블</text>
    <rect class="node" x="256" y="252" width="168" height="96" rx="8"/>
<text class="node-title" x="340" y="282" text-anchor="middle">CRUD 코드 생성</text>
<text class="node-meta" x="340" y="306" text-anchor="middle">변경 전 행 저장</text>
    <rect class="node node-accent" x="512" y="148" width="184" height="104" rx="8"/>
<text class="node-title" x="604" y="178" text-anchor="middle">변경 이력</text>
<text class="node-meta" x="604" y="202" text-anchor="middle">PK · 수정자 · 유효 기간</text>
<text class="node-meta" x="604" y="217" text-anchor="middle">행 데이터</text>
    <rect class="node" x="760" y="152" width="168" height="96" rx="8"/>
<text class="node-title" x="844" y="182" text-anchor="middle">지정 날짜</text>
<text class="node-title" x="844" y="200" text-anchor="middle">상태 복원</text>
<text class="node-meta" x="844" y="224" text-anchor="middle">행 값 · 마지막 변경자</text>

  </g>
</svg>
