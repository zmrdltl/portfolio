<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title desc">
  <title id="title">Coupler 가입·회원 심사 상태 흐름</title>
  <desc id="desc">기본정보와 필수 프로필 제출 뒤 최초 가입 심사를 거치며, 반려 시 수정·재제출하고 승인 뒤 준회원 또는 정회원 심사를 독립적으로 제출하는 상태 흐름입니다.</desc>
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');
      svg {
        --paper: #f5f5f5;
        --paper-2: #fafafa;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #667085;
        --rule: rgba(45, 49, 66, 0.12);
        --rule-solid: #bfc0c0;
        --accent: #4051b5;
        --accent-tint: rgba(64, 81, 181, 0.08);
        --link: #2e5aa8;
      }
      text { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
      .connector { fill: none; stroke: var(--muted); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; }
      .connector-accent { stroke: var(--accent); stroke-width: 1.6; }
      .connector-secondary { stroke-dasharray: 5 5; stroke-width: 1.1; }
      .node { fill: var(--paper-2); stroke: var(--rule-solid); stroke-width: 1; }
      .node-accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
      .node-terminal { fill: rgba(45, 49, 66, 0.05); }
      .node-title { fill: var(--ink); font-size: 13px; font-weight: 600; }
      .node-meta, .edge-label, .callout-kicker { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node-meta { fill: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.035em; }
      .edge-label { fill: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.025em; }
      .edge-label-accent { fill: var(--accent); }
      .label-mask { fill: var(--paper); }
      .lifeline { stroke: var(--rule-solid); stroke-dasharray: 4 6; stroke-width: 1; }
      .decision { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
      .start { fill: var(--ink); }
      .callout { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1; }
      .callout-kicker { fill: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
      .callout-text { fill: var(--ink); font-size: 11px; font-weight: 500; }
      .arrow { fill: var(--muted); }
      .arrow-accent { fill: var(--accent); }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" overflow="visible">
      <polygon class="arrow" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" overflow="visible">
      <polygon class="arrow-accent" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>
  <rect width="960" height="448" fill="var(--paper)"/>
  <g aria-hidden="true">
    <path class="connector" d="M 36 132 H 56" marker-end="url(#arrow)"/>
    <path class="connector" d="M 240 132 H 280" marker-end="url(#arrow)"/>
    <path class="connector" d="M 376 180 V 292" marker-end="url(#arrow)"/>
    <path class="connector" d="M 288 348 H 272 Q 264 348 264 340 V 164 Q 264 156 272 156 H 280" marker-end="url(#arrow)"/>
    <path class="connector connector-accent" d="M 464 132 H 504" marker-end="url(#arrow-accent)"/>
    <path class="connector" d="M 688 116 H 716 Q 724 116 724 108 V 88 Q 724 80 732 80 H 744" marker-end="url(#arrow)"/>
    <path class="connector" d="M 688 148 H 716 Q 724 148 724 156 V 228 Q 724 236 732 236 H 744" marker-end="url(#arrow)"/>
<rect class="label-mask" x="232" y="100" width="64" height="26" rx="4"/>
<text class="edge-label" x="264" y="117" text-anchor="middle">심사 요청</text>
    <rect class="label-mask" x="312" y="220" width="56" height="26" rx="4"/>
<text class="edge-label" x="340" y="237" text-anchor="middle">반려</text>
    <rect class="label-mask" x="192" y="236" width="64" height="26" rx="4"/>
<text class="edge-label" x="224" y="253" text-anchor="middle">재제출</text>
    <rect class="label-mask" x="456" y="100" width="64" height="26" rx="4"/>
<text class="edge-label edge-label-accent" x="488" y="117" text-anchor="middle">승인</text>
    <rect class="label-mask" x="680" y="46" width="56" height="26" rx="4"/>
<text class="edge-label" x="708" y="63" text-anchor="middle">제출</text>
    <rect class="label-mask" x="660" y="200" width="56" height="26" rx="4"/>
<text class="edge-label" x="688" y="217" text-anchor="middle">제출</text>
    <circle class="start" cx="28" cy="132" r="7"/>
    <rect class="node" x="64" y="84" width="176" height="96" rx="8"/>
<text class="node-title" x="152" y="114" text-anchor="middle">기본정보·필수</text>
<text class="node-title" x="152" y="132" text-anchor="middle">프로필 제출</text>
<text class="node-meta" x="152" y="156" text-anchor="middle">SUBMITTED</text>
    <rect class="node" x="288" y="84" width="176" height="96" rx="8"/>
<text class="node-title" x="376" y="114" text-anchor="middle">최초 가입 심사</text>
<text class="node-meta" x="376" y="138" text-anchor="middle">INITIAL REVIEW</text>
    <rect class="node" x="288" y="300" width="176" height="96" rx="8"/>
<text class="node-title" x="376" y="330" text-anchor="middle">수정·재제출</text>
<text class="node-meta" x="376" y="354" text-anchor="middle">REAPPLY</text>
    <rect class="node node-accent" x="512" y="84" width="176" height="96" rx="8"/>
<text class="node-title" x="600" y="114" text-anchor="middle">다음 심사</text>
<text class="node-title" x="600" y="132" text-anchor="middle">단계 개방</text>
<text class="node-meta" x="600" y="156" text-anchor="middle">REVIEW OPEN</text>
    <rect class="node" x="752" y="36" width="176" height="96" rx="8"/>
<text class="node-title" x="840" y="66" text-anchor="middle">준회원 심사</text>
<text class="node-meta" x="840" y="90" text-anchor="middle">ASSOCIATE</text>
    <rect class="node" x="752" y="188" width="176" height="96" rx="8"/>
<text class="node-title" x="840" y="218" text-anchor="middle">정회원 심사</text>
<text class="node-meta" x="840" y="242" text-anchor="middle">FULL</text>

  </g>
</svg>
