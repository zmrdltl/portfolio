site_name: 김민식 기술 포트폴리오
site_description: Software Engineer 기술 상세와 공개 링크 포트폴리오
site_url: https://zmrdltl.github.io/portfolio/
repo_url: https://github.com/zmrdltl/portfolio
repo_name: zmrdltl/portfolio

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mermaid.min.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          name: 한국어
          build: true
          default: true
        - locale: en
          name: English
          build: true
          site_name: Kim Minsik Technical Portfolio
          site_description: Software Engineer technical context and public links portfolio
          theme:
            language: en
          nav_translations:
            소개: Overview
            경력: Work
            티맥스클라우드: TmaxCloud

nav:
  - 소개: index.md
  - 경력:
      - ClumL: experience/cluml.md
      - 티맥스클라우드: experience/tmaxcloud.md
  - GlueSQL: opensource/gluesql.md
  - Coupler: projects/coupler.md
