site_name: 김민식 기술 포트폴리오
site_description: Software Engineer 기술 상세와 공개 링크 포트폴리오
site_url: https://zmrdltl.github.io/portfolio/
repo_url: https://github.com/zmrdltl/portfolio
repo_name: zmrdltl/portfolio

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          name: 한국어
          build: true
          default: true
        - locale: en
          name: English
          build: true
          site_name: Kim Minsik Technical Portfolio
          site_description: Software Engineer technical context and public links portfolio
          theme:
            language: en
          nav_translations:
            소개: Overview
            원칙: Principles
            경력: Work
            요약: Summary
            티맥스클라우드: TmaxCloud
            오픈소스: Open Source
            프로젝트: Projects
            목록: List
            1GB 이상 CSV 데이터 처리: CSV Batch Pipeline
            지도 기반 소리 업로드/조회 사이트: Map-based Sound Upload Site
            LoL 악성 유저 검출: LoL Toxic User Detection
            졸업요건 공지사항 조회 사이트: Graduation Requirement Notice Site
            활동: Activities

nav:
  - 소개: index.md
  - 원칙: engineering-principles.md
  - 경력:
      - 요약: experience/index.md
      - ClumL: experience/cluml.md
      - 티맥스클라우드: experience/tmaxcloud.md
  - 오픈소스:
      - GlueSQL: opensource/gluesql.md
  - 프로젝트:
      - 목록: projects/index.md
      - Coupler: projects/coupler.md
      - 1GB 이상 CSV 데이터 처리: projects/csv-batch.md
      - 지도 기반 소리 업로드/조회 사이트: projects/map-sound.md
      - Dishnow: projects/dishnow.md
      - LoL 악성 유저 검출: projects/lol-toxic-user.md
      - 졸업요건 공지사항 조회 사이트: projects/graduation-credit.md
  - 활동: activities/index.md
