<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <title>페이지를 찾을 수 없습니다</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        color: #17202a;
        background: #f6f7f9;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 2.5rem));
      }

      .status {
        margin: 0 0 0.5rem;
        color: #52606d;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
      }

      p {
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      a {
        padding: 0.7rem 1rem;
        border: 1px solid #8b98a5;
        border-radius: 0.4rem;
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        border-color: #4051b5;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f3f5f7;
          background: #111418;
        }

        .status {
          color: #aeb8c2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>페이지를 찾을 수 없습니다 · <span lang="en">Page not found</span></h1>
      <p>요청한 페이지가 없거나 이동했습니다.</p>
      <p lang="en">The page does not exist or has moved.</p>
      <nav aria-label="홈으로 이동">
        <a href="/portfolio/" lang="ko">한국어 홈</a>
        <a href="/portfolio/en/" lang="en">English home</a>
      </nav>
    </main>
  </body>
</html>
